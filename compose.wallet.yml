services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerlens
      POSTGRES_PASSWORD: ledgerlens-local
      POSTGRES_DB: ledgerlens
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlens"]
      interval: 2s
      retries: 20
