[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlens-recon"
version = "0.1.0"
description = "Payment reconciliation CLI (portfolio/demo project)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "SQLAlchemy>=2.0.0",
  "psycopg2-binary>=2.9.9",
  "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9.0",
  "black>=24.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ledgerlens_recon*"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
